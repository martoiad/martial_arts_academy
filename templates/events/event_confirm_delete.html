{% extends 'base.html' %}

{% block title %}
    Delete Event | Martial Arts Academy
{% endblock %}

{% block content %}
    <h2>Delete Event</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ object.title }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'event-detail' object.pk %}">Cancel</a>
{% endblock %}
