{% extends 'base.html' %}

{% block title %}
    {{ object.name }} | Martial Arts Academy
{% endblock %}

{% block content %}
    <h2>{{ object.name }}</h2>

    <p>Martial Art: {{ object.martial_art.name }}</p>
    <p>Level: {{ object.get_level_display }}</p>
    <p>{{ object.description }}</p>

    <a href="{% url 'curriculum-list' %}">Back to Curriculum</a>
{% endblock %}
